<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISC Staking | Professional Yield Protocol</title>
    <link rel="icon" type="image/svg+xml" href="https://icesnowcoin.com/logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root { --primary: #22d3ee; --secondary: #818cf8; --bg: #020617; --card-bg: rgba(15, 23, 42, 0.6); }
        body { background-color: var(--bg); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid rgba(51, 65, 85, 0.4); }
        .text-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-hover { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-hover:hover { transform: translateY(-10px) scale(1.02); border-color: rgba(34, 211, 238, 0.5); box-shadow: 0 30px 60px -12px rgba(34, 211, 238, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #0891b2 0%, #4f46e5 100%); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.2); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
        .badge-single { background: rgba(34, 211, 238, 0.1); color: var(--primary); border: 1px solid rgba(34, 211, 238, 0.2); }
        .badge-lp { background: rgba(139, 92, 246, 0.1); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.2); }
        #snow-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5; }
        .lock-timer { font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
        #toast { transform: translateX(150%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: fixed; top: 6rem; right: 1.5rem; z-index: 100; }
        #toast.show { transform: translateX(0); }
        .nft-card { border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; background: rgba(15, 23, 42, 0.8); }
        .nft-card:hover { border-color: rgba(34, 211, 238, 0.3); transform: scale(1.02); }
        .nft-card.selected { border-color: var(--primary); background: rgba(34, 211, 238, 0.1); box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); }
    </style>
</head>
<body class="min-h-screen">
    <canvas id="snow-canvas"></canvas>
    <div id="toast" class="glass px-6 py-4 rounded-2xl flex items-center gap-4 shadow-2xl border-l-4 border-l-cyan-500">
        <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2.5"/></svg></div>
        <p id="toast-msg" class="text-sm font-bold tracking-tight"></p>
    </div>
    <nav class="fixed top-0 w-full z-50 glass border-b border-slate-800/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4"><img src="https://icesnowcoin.com/logo.svg" class="h-10 w-10" alt="ISC"><span class="font-extrabold tracking-tighter text-xl">ISC <span class="text-cyan-400">Yield Hub</span></span></div>
            <div class="flex items-center gap-6">
                <div class="flex bg-slate-900/90 rounded-xl p-1.5 border border-slate-700/50">
                    <button onclick="setLang('zh')" id="lang-zh" class="px-4 py-2 rounded-lg text-xs font-bold transition-all hover:text-cyan-400">中文</button>
                    <button onclick="setLang('en')" id="lang-en" class="px-4 py-2 rounded-lg text-xs font-bold transition-all hover:text-cyan-400">EN</button>
                </div>
                <button id="connect-btn" class="btn-primary px-6 py-3 rounded-2xl text-sm font-bold shadow-xl" data-i18n="conn_wallet">Connect Wallet</button>
            </div>
        </div>
    </nav>
    <main class="relative z-10 pt-40 pb-32 px-6 max-w-7xl mx-auto">
        <div class="text-center mb-24">
            <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter" data-i18n="hero_title"></h1>
            <p class="text-slate-400 text-xl max-w-3xl mx-auto mb-12 leading-relaxed" data-i18n="hero_desc"></p>
            <div class="glass p-5 rounded-3xl inline-flex items-center gap-4 border-cyan-500/20">
                <span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-cyan-500"></span></span>
                <p class="text-sm font-bold text-cyan-50" data-i18n="treasury_info"></p>
                <a href="https://bscscan.com/address/0x9014Be9d27b64a4cb889B9d0334740683F18185a" target="_blank" class="text-cyan-400 hover:text-white transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-width="2"/></svg></a>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-20">
            <div class="glass p-8 rounded-[2.5rem] border-cyan-500/10"><p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3" data-i18n="stat_tvl"></p><div class="text-3xl font-black text-gradient" id="total-staked">0.00 ISC</div></div>
            <div class="glass p-8 rounded-[2.5rem]"><p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3" data-i18n="stat_bal"></p><div class="text-3xl font-black" id="user-balance">0.00</div></div>
            <div class="glass p-8 rounded-[2.5rem]"><p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3" data-i18n="stat_staked"></p><div class="text-3xl font-black" id="user-staked">0.00</div></div>
            <div class="glass p-8 rounded-[2.5rem] border-emerald-500/10"><p class="text-slate-500 text-xs font-black uppercase tracking-widest mb-3" data-i18n="stat_reward"></p><div class="text-3xl font-black text-emerald-400" id="user-reward">0.0000</div></div>
        </div>
        <div id="pools-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-10 mb-32"></div>
    </main>
    <footer class="border-t border-slate-800/50 bg-slate-950/50 py-20 px-6">
        <div class="max-w-7xl mx-auto text-center"><p class="text-slate-600 text-xs font-bold uppercase tracking-widest">&copy; 2026 Ice Snow Coin Ecosystem. All Rights Reserved.</p></div>
    </footer>
    <div id="modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center px-6">
        <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="glass w-full max-w-lg p-10 rounded-[3rem] relative z-10 border-cyan-500/30 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-500 hover:text-white"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2.5"/></svg></button>
            <h3 id="modal-title" class="text-3xl font-black mb-3"></h3><p id="modal-pool-info" class="text-slate-400 font-medium mb-10"></p>
            <div class="space-y-8">
                <div id="single-stake-ui">
                    <div class="flex justify-between text-[10px] font-black mb-3 uppercase tracking-widest"><span class="text-slate-500" data-i18n="modal_amount"></span><span class="text-cyan-400 cursor-pointer hover:underline" onclick="setMax()" data-i18n="modal_max"></span></div>
                    <div class="relative"><input type="number" id="stake-input" class="w-full bg-slate-950/80 border border-slate-700 rounded-[1.5rem] px-6 py-5 text-2xl font-black focus:outline-none focus:border-cyan-500 transition-all shadow-inner" placeholder="0.00"><span class="absolute right-6 top-1/2 -translate-y-1/2 text-xs font-black text-slate-600">ISC</span></div>
                </div>
                <div id="lp-stake-ui" class="hidden space-y-4">
                    <p class="text-xs font-black text-slate-500 uppercase tracking-widest" data-i18n="select_position">Select Liquidity Position (NFT)</p>
                    <div id="nft-list" class="grid grid-cols-1 gap-4 max-h-80 overflow-y-auto pr-2"></div>
                </div>
                <div class="glass bg-slate-950/50 p-6 rounded-3xl space-y-4 border-slate-800/50">
                    <div class="flex justify-between text-sm font-bold"><span class="text-slate-500" data-i18n="modal_apr"></span><span class="text-cyan-400 font-black" id="modal-apr">0%</span></div>
                    <div class="flex justify-between text-sm font-bold"><span class="text-slate-500" data-i18n="modal_lock"></span><span class="text-white font-black" id="modal-lock">0</span></div>
                </div>
                <button id="confirm-btn" onclick="executeTransaction()" class="btn-primary w-full py-5 rounded-[1.5rem] font-black text-xl shadow-2xl disabled:opacity-50"></button>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('snow-canvas'); const ctx = canvas.getContext('2d'); let width, height, snowflakes = [];
        function initSnow() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; snowflakes = Array.from({ length: 60 }, () => ({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2 + 0.5, v: Math.random() * 1.5 + 0.5, a: Math.random() * 0.02 })); }
        function drawSnow() { ctx.clearRect(0, 0, width, height); ctx.fillStyle = 'white'; ctx.beginPath(); snowflakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); f.y += f.v; f.x += Math.sin(f.a += 0.01); if (f.y > height) { f.y = -10; f.x = Math.random() * width; } }); ctx.fill(); requestAnimationFrame(drawSnow); }
        window.addEventListener('resize', initSnow); initSnow(); drawSnow();
        const TRANSLATIONS = {
            zh: { hero_title: "开启您的 <span class='text-gradient'>收益增长</span>", hero_desc: "UNCX 级流动性管理，自动扫描您的 NFT 仓位，卡片式选择，安全质押并赚取高额收益。", treasury_info: "20,260,000 ISC 已全额注入奖励合约", stat_tvl: "全网总质押量 (TVL)", stat_bal: "可用余额", stat_staked: "已质押总额", stat_reward: "待领取收益", single_badge: "单币池", lp_badge: "LP池", lp_desc: "ISC/USDT LP", stake_btn: "立即质押", harvest_btn: "领取收益", unstake_btn: "解除质押", modal_stake: "质押资产", modal_unstake: "解除质押", modal_amount: "输入数量", modal_max: "最大值", modal_apr: "预计收益率 (APR)", modal_lock: "合约锁定期", select_position: "选择流动性仓位 (NFT)", confirm_btn: "确认操作", pending: "处理中...", success: "交易成功！", error: "操作失败: ", conn_wallet: "连接钱包", days: "天", unlock_in: "解锁倒计时", unlocked: "已解锁" },
            en: { hero_title: "Unlock Your <span class='text-gradient'>Yield Growth</span>", hero_desc: "UNCX-grade liquidity management. Auto-scan your NFT positions, card-based selection, stake securely and earn rewards.", treasury_info: "20,260,000 ISC fully funded in rewards contract", stat_tvl: "Total Value Locked (TVL)", stat_bal: "Available Balance", stat_staked: "Total Staked", stat_reward: "Pending Rewards", single_badge: "Single Pool", lp_badge: "LP Pool", lp_desc: "ISC/USDT LP", stake_btn: "Stake Now", harvest_btn: "Harvest", unstake_btn: "Unstake", modal_stake: "Stake Asset", modal_unstake: "Unstake", modal_amount: "Enter Amount", modal_max: "MAX BALANCE", modal_apr: "Est. APR", modal_lock: "Contract Lock", select_position: "Select Position (NFT)", confirm_btn: "Confirm Action", pending: "Processing...", success: "Transaction Success!", error: "Action Failed: ", conn_wallet: "Connect Wallet", days: "Days", unlock_in: "Unlock in", unlocked: "Unlocked" }
        };
        let currentLang = localStorage.getItem('isc_lang') || 'zh'; let provider, signer, stakingContract, iscContract, userAddress = null, pools = [], currentPoolId = null, isStakingMode = true, selectedNftId = null;
        const CONFIG = { STAKING_ADDR: "0x9014Be9d27b64a4cb889B9d0334740683F18185a", ISC_ADDR: "0x11229a3f976566FA8a3ba462C432122f3B8876f6", RPC: "https://bsc-dataseed.binance.org" };
        const ABI = ["function poolLength() view returns (uint256)", "function poolInfo(uint256) view returns (address lpToken, uint256 allocPoint, uint256 lastRewardBlock, uint256 accISCPerShare, uint256 lockUpDuration, uint256 apr)", "function userInfo(uint256, address) view returns (uint256 amount, uint256 rewardDebt, uint256 unclaimedRewards, uint256 lastDepositTime)", "function pendingISC(uint256, address) view returns (uint256)", "function deposit(uint256, uint256)", "function withdraw(uint256, uint256)", "function harvest(uint256)", "function balanceOf(address) view returns (uint256)", "function approve(address, uint256) returns (bool)", "function allowance(address, address) view returns (uint256)", "function tokenOfOwnerByIndex(address, uint256) view returns (uint256)", "function tokenURI(uint256) view returns (string)"];
        
        function setLang(lang) {
            currentLang = lang; localStorage.setItem('isc_lang', lang); const t = TRANSLATIONS[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(t[key]) el.innerHTML = t[key]; });
            if(pools && pools.length > 0) renderPools();
        }

        async function init() { setLang(currentLang); try { provider = new ethers.providers.JsonRpcProvider(CONFIG.RPC); stakingContract = new ethers.Contract(CONFIG.STAKING_ADDR, ABI, provider); iscContract = new ethers.Contract(CONFIG.ISC_ADDR, ABI, provider); if (window.ethereum) { const web3Provider = new ethers.providers.Web3Provider(window.ethereum); const accounts = await web3Provider.listAccounts(); if (accounts.length > 0) { userAddress = accounts[0]; signer = web3Provider.getSigner(); document.getElementById("connect-btn").innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4); } } await loadData(); setInterval(updateTimers, 1000); } catch(e) { console.error("Init Error:", e); } }
        async function loadData() { try { const [tvl, len] = await Promise.all([iscContract.balanceOf(CONFIG.STAKING_ADDR), stakingContract.poolLength()]); document.getElementById("total-staked").innerText = parseFloat(ethers.utils.formatEther(tvl)).toLocaleString() + " ISC"; const poolPromises = []; for(let i=0; i<len.toNumber(); i++) poolPromises.push(stakingContract.poolInfo(i)); const poolResults = await Promise.all(poolPromises); pools = poolResults.map((p, i) => ({ id: i, lpToken: p.lpToken, lockPeriod: p.lockUpDuration.toNumber(), apr: p.apr.toNumber() / 100, isLP: p.lpToken.toLowerCase() !== CONFIG.ISC_ADDR.toLowerCase() })); if(userAddress) { const [bal, userResults, rewardResults] = await Promise.all([ iscContract.balanceOf(userAddress), Promise.all(pools.map(p => stakingContract.userInfo(p.id, userAddress))), Promise.all(pools.map(p => stakingContract.pendingISC(p.id, userAddress))) ]); let totalUserStaked = ethers.BigNumber.from(0), totalUserReward = ethers.BigNumber.from(0); pools.forEach((p, i) => { p.userStaked = userResults[i].amount; p.lastDepositTime = userResults[i].lastDepositTime.toNumber(); p.userReward = rewardResults[i]; totalUserStaked = totalUserStaked.add(p.userStaked); totalUserReward = totalUserReward.add(p.userReward); }); document.getElementById("user-balance").innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(2); document.getElementById("user-staked").innerText = parseFloat(ethers.utils.formatEther(totalUserStaked)).toFixed(2); document.getElementById("user-reward").innerText = parseFloat(ethers.utils.formatEther(totalUserReward)).toFixed(4); } renderPools(); } catch(e) { console.error("Data Error:", e); } }
        function renderPools() { const container = document.getElementById("pools-container"); if(!container || !pools || pools.length === 0) return; const t = TRANSLATIONS[currentLang]; container.innerHTML = pools.map(p => { const isLocked = userAddress && p.userStaked && p.userStaked.gt(0) && (Date.now() / 1000 < p.lastDepositTime + p.lockPeriod); return `<div class="glass p-10 rounded-[2.5rem] card-hover flex flex-col relative overflow-hidden"><div class="absolute top-0 right-0 p-6"><span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${p.isLP ? 'badge-lp' : 'badge-single'}">${p.isLP ? t.lp_badge : t.single_badge}</span></div><div class="mb-10"><div class="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2">${p.lockPeriod / 86400} ${t.days} ${p.isLP ? t.lp_desc : ''}</div><div class="text-5xl font-black text-white">${p.apr}% <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">APR</span></div></div><div class="space-y-5 mb-10 flex-grow"><div class="flex justify-between items-center"><span class="text-slate-500 text-[10px] font-black uppercase tracking-widest">${t.stat_staked}</span><span class="font-black text-sm">${userAddress && p.userStaked ? parseFloat(ethers.utils.formatEther(p.userStaked)).toFixed(2) : '0.00'} ISC</span></div><div class="flex justify-between items-center"><span class="text-slate-500 text-[10px] font-black uppercase tracking-widest">${t.stat_reward}</span><span class="font-black text-sm text-emerald-400">${userAddress && p.userReward ? parseFloat(ethers.utils.formatEther(p.userReward)).toFixed(4) : '0.0000'} ISC</span></div><div class="pt-4 border-t border-slate-800/50 flex flex-col gap-2"><span class="text-[10px] font-black uppercase tracking-widest text-slate-600">${t.unlock_in}</span><span class="text-xs font-bold lock-timer" id="timer-${p.id}">--</span></div></div><div class="grid grid-cols-2 gap-4"><button onclick="openModal(${p.id}, true)" class="btn-primary py-4 rounded-2xl text-xs font-black shadow-xl">${t.stake_btn}</button><button onclick="executeHarvest(${p.id})" class="glass py-4 rounded-2xl text-xs font-black hover:bg-white/10 transition-colors">${t.harvest_btn}</button><button onclick="openModal(${p.id}, false)" ${isLocked ? 'disabled' : ''} class="col-span-2 text-slate-600 hover:text-white disabled:opacity-30 disabled:cursor-not-allowed text-[10px] font-black uppercase tracking-[0.2em] py-3 transition-colors">${t.unstake_btn}</button></div></div>`; }).join(''); updateTimers(); }
        function updateTimers() { if(!pools || pools.length === 0) return; pools.forEach(p => { const el = document.getElementById(`timer-${p.id}`); if(!el || !userAddress || !p.userStaked || p.userStaked.isZero()) { if(el) el.innerText = "--"; return; } const remaining = (p.lastDepositTime + p.lockPeriod) - (Date.now() / 1000); if(remaining <= 0) { el.innerText = TRANSLATIONS[currentLang].unlocked; el.classList.add("text-emerald-400"); } else { const d = Math.floor(remaining / 86400), h = Math.floor((remaining % 86400) / 3600), m = Math.floor((remaining % 3600) / 60), s = Math.floor(remaining % 60); el.innerText = `${d}d ${h}h ${m}m ${s}s`; el.classList.remove("text-emerald-400"); } }); }
        async function openModal(id, isStake) { if(!userAddress) return showToast(TRANSLATIONS[currentLang].conn_wallet); currentPoolId = id; isStakingMode = isStake; const p = pools[id], t = TRANSLATIONS[currentLang]; document.getElementById("modal").classList.remove("hidden"); document.getElementById("modal-title").innerText = isStake ? t.modal_stake : t.modal_unstake; document.getElementById("modal-pool-info").innerText = `${p.lockPeriod / 86400} ${t.days} ${p.isLP ? t.lp_desc : ''} (${p.apr}%)`; document.getElementById("modal-apr").innerText = p.apr + "%"; document.getElementById("modal-lock").innerText = (p.lockPeriod / 86400) + " " + t.days; document.getElementById("confirm-btn").innerText = t.confirm_btn; if(p.isLP && isStake) { document.getElementById("single-stake-ui").classList.add("hidden"); document.getElementById("lp-stake-ui").classList.remove("hidden"); await loadUserNfts(p.lpToken); } else { document.getElementById("single-stake-ui").classList.remove("hidden"); document.getElementById("lp-stake-ui").classList.add("hidden"); document.getElementById("stake-input").value = ""; } }
        async function loadUserNfts(lpAddr) { const list = document.getElementById("nft-list"); list.innerHTML = `<div class="text-center py-10 text-slate-500 animate-pulse">Scanning Positions...</div>`; try { const lpContract = new ethers.Contract(lpAddr, ABI, provider); const bal = await lpContract.balanceOf(userAddress); if(bal.isZero()) { list.innerHTML = `<div class="text-center py-10 text-slate-500">No Positions Found</div>`; return; } let html = ""; for(let i=0; i<bal.toNumber(); i++) { const tid = await lpContract.tokenOfOwnerByIndex(userAddress, i); html += `<div onclick="selectNft('${tid}')" id="nft-${tid}" class="nft-card glass p-6 rounded-2xl flex justify-between items-center"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center text-cyan-400 font-black">#${tid.toString().slice(-4)}</div><div><p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Pancakeswap V3 NFT</p><p class="text-lg font-black">ID: ${tid}</p></div></div><div class="w-6 h-6 rounded-full border-2 border-slate-700"></div></div>`; } list.innerHTML = html; } catch(e) { console.error(e); list.innerHTML = `<div class="text-center py-10 text-slate-500">Error Loading NFTs. Ensure LP is NFT based.</div>`; } }
        function selectNft(id) { document.querySelectorAll('.nft-card').forEach(el => el.classList.remove('selected')); document.getElementById('nft-'+id).classList.add('selected'); selectedNftId = id; }
        function closeModal() { document.getElementById("modal").classList.add("hidden"); }
        async function setMax() { const p = pools[currentPoolId]; if(isStakingMode) { const tokenContract = new ethers.Contract(p.lpToken, ABI, provider); const bal = await tokenContract.balanceOf(userAddress); document.getElementById("stake-input").value = ethers.utils.formatEther(bal); } else { document.getElementById("stake-input").value = ethers.utils.formatEther(p.userStaked); } }
        async function executeTransaction() { const p = pools[currentPoolId]; let val; if(p.isLP && isStakingMode) { if(!selectedNftId) return showToast("Please select an NFT position"); val = selectedNftId; } else { val = document.getElementById("stake-input").value; } if(!val) return; const btn = document.getElementById("confirm-btn"), t = TRANSLATIONS[currentLang]; try { btn.disabled = true; btn.innerText = t.pending; const signer = new ethers.providers.Web3Provider(window.ethereum).getSigner(); if(isStakingMode) { const tokenContract = new ethers.Contract(p.lpToken, ABI, signer); if(p.isLP) { await (await tokenContract.approve(CONFIG.STAKING_ADDR, val)).wait(); await (await stakingContract.connect(signer).deposit(currentPoolId, val)).wait(); } else { const wei = ethers.utils.parseEther(val); const allowance = await tokenContract.allowance(userAddress, CONFIG.STAKING_ADDR); if(allowance.lt(wei)) await (await tokenContract.approve(CONFIG.STAKING_ADDR, ethers.constants.MaxUint256)).wait(); await (await stakingContract.connect(signer).deposit(currentPoolId, wei)).wait(); } } else { const wei = ethers.utils.parseEther(val); await (await stakingContract.connect(signer).withdraw(currentPoolId, wei)).wait(); } showToast(t.success); closeModal(); loadData(); } catch(e) { showToast(t.error + (e.data?.message || e.message)); } finally { btn.disabled = false; btn.innerText = t.confirm_btn; } }
        async function executeHarvest(id) { if(!userAddress) return showToast(TRANSLATIONS[currentLang].conn_wallet); try { const signer = new ethers.providers.Web3Provider(window.ethereum).getSigner(); await (await stakingContract.connect(signer).harvest(id)).wait(); showToast(TRANSLATIONS[currentLang].success); loadData(); } catch(e) { showToast(TRANSLATIONS[currentLang].error + (e.data?.message || e.message)); } }
        function showToast(msg) { const toast = document.getElementById('toast'); if(!toast) return; document.getElementById('toast-msg').innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 4000); }
        document.getElementById("connect-btn").onclick = async () => { if (window.ethereum) { await window.ethereum.request({ method: "eth_requestAccounts" }); window.location.reload(); } else { alert("Please install MetaMask!"); } };
        window.onload = init;
    </script>
</body>
