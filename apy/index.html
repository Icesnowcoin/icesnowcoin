    <script>
        const canvas = document.getElementById('snow-canvas'); const ctx = canvas.getContext('2d'); let width, height, snowflakes = [];
        function initSnow() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; snowflakes = Array.from({ length: 80 }, () => ({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 3 + 1, d: Math.random() * 1, v: Math.random() * 2 + 0.5, a: Math.random() * 0.02 })); }
        function drawSnow() { ctx.clearRect(0, 0, width, height); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.beginPath(); snowflakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); f.y += f.v; f.x += Math.sin(f.a += 0.01); if (f.y > height) { f.y = -10; f.x = Math.random() * width; } }); ctx.fill(); requestAnimationFrame(drawSnow); }
        window.addEventListener('resize', initSnow); initSnow(); drawSnow();
        const TRANSLATIONS = {
            zh: { hero_title: "开启您的 <span class='text-gradient'>收益增长</span>", hero_desc: "通过经过审计的智能合约安全地质押您的代币，赚取行业领先的可持续奖励。", treasury_info: "20,260,000 ISC 已全额注入质押奖励合约", stat_tvl: "全网总质押量 (TVL)", stat_bal: "我的可用余额", stat_staked: "我已质押总额", stat_reward: "待领取总收益", calc_title: "收益智能计算器", calc_desc: "基于实时链上数据，精准预估您的质押回报。", calc_result: "预计总收益", calc_placeholder: "输入金额", footer_desc: "Ice Snow Coin (ISC) 致力于构建一个完全去中心化、透明且由社区驱动的冰雪生态系统。", footer_links: "快速访问", footer_community: "社区枢纽", single_badge: "单币池", lp_badge: "LP池", lp_desc: "ISC/USDT LP", stake_btn: "立即质押", harvest_btn: "领取收益", unstake_btn: "解除质押", modal_stake: "质押资产", modal_unstake: "解除质押", modal_amount: "输入数量", modal_apr: "预计收益率 (APR)", modal_lock: "合约锁定期", confirm_btn: "确认操作", pending: "处理中...", success: "交易成功！", error: "操作失败: ", conn_wallet: "连接钱包", days: "天", calc_opts: ["7天 单币 (5%)", "15天 单币 (6%)", "30天 单币 (7%)", "90天 单币 (8%)", "7天 LP (8%)", "15天 LP (10%)", "30天 LP (12%)", "90天 LP (15%)"] },
            en: { hero_title: "Unlock Your <span class='text-gradient'>Yield Growth</span>", hero_desc: "Securely stake your tokens via audited smart contracts and earn industry-leading sustainable rewards.", treasury_info: "20,260,000 ISC fully funded in rewards contract", stat_tvl: "Total Value Locked (TVL)", stat_bal: "My Available Balance", stat_staked: "My Total Staked", stat_reward: "Total Pending Rewards", calc_title: "Smart Yield Calculator", calc_desc: "Accurately estimate your staking returns based on real-time on-chain data.", calc_result: "Estimated Total Yield", calc_placeholder: "Enter Amount", footer_desc: "Ice Snow Coin (ISC) is dedicated to building a fully decentralized, transparent, and community-driven ecosystem.", footer_links: "Quick Access", footer_community: "Community Hub", single_badge: "Single Pool", lp_badge: "LP Pool", lp_desc: "ISC/USDT LP", stake_btn: "Stake Now", harvest_btn: "Harvest", unstake_btn: "Unstake", modal_stake: "Stake Asset", modal_unstake: "Unstake", modal_amount: "Enter Amount", modal_apr: "Est. APR", modal_lock: "Contract Lock", confirm_btn: "Confirm Action", pending: "Processing...", success: "Transaction Success!", error: "Action Failed: ", conn_wallet: "Connect Wallet", days: "Days", calc_opts: ["7 Days Single (5%)", "15 Days Single (6%)", "30 Days Single (7%)", "90 Days Single (8%)", "7 Days LP (8%)", "15 Days LP (10%)", "30 Days LP (12%)", "90 Days LP (15%)"] }
        };
        let currentLang = localStorage.getItem('isc_lang') || 'zh'; let provider, signer, stakingContract, iscContract, userAddress = null, pools = [], currentPoolId = null, isStakingMode = true;
        const CONFIG = { STAKING_ADDR: "0x9014Be9d27b64a4cb889B9d0334740683F18185a", ISC_ADDR: "0x11229a3f976566FA8a3ba462C432122f3B8876f6", RPC: "https://bsc-dataseed.binance.org" };
        const ABI = ["function poolLength() view returns (uint256)", "function poolInfo(uint256) view returns (address lpToken, uint256 allocPoint, uint256 lastRewardBlock, uint256 accISCPerShare, uint256 lockPeriod, uint256 apr)", "function userInfo(uint256, address) view returns (uint256 amount, uint256 rewardDebt, uint256 lastStakeTime)", "function pendingISC(uint256, address) view returns (uint256)", "function deposit(uint256, uint256)", "function withdraw(uint256, uint256)", "function harvest(uint256)", "function balanceOf(address) view returns (uint256)", "function approve(address, uint256) returns (bool)", "function allowance(address, address) view returns (uint256)"];
        
        function setLang(lang) {
            currentLang = lang; localStorage.setItem('isc_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === `lang-${lang}`));
            const t = TRANSLATIONS[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if(t[key]) el.innerHTML = t[key]; });
            document.querySelectorAll('[data-i18n-attr]').forEach(el => { const [attr, key] = el.getAttribute('data-i18n-attr').split(':'); if(t[key]) el.setAttribute(attr, t[key]); });
            const calcSelect = document.getElementById('calc-pool'); const currentVal = calcSelect.value;
            calcSelect.innerHTML = t.calc_opts.map((opt, i) => { const aprs = [5,6,7,8,8,10,12,15]; return `<option value="${aprs[i]}">${opt}</option>`; }).join('');
            if(currentVal) calcSelect.value = currentVal;
            if(pools.length > 0) renderPools();
        }

        async function init() { setLang(currentLang); provider = new ethers.providers.JsonRpcProvider(CONFIG.RPC); stakingContract = new ethers.Contract(CONFIG.STAKING_ADDR, ABI, provider); iscContract = new ethers.Contract(CONFIG.ISC_ADDR, ABI, provider); if (window.ethereum) { const web3Provider = new ethers.providers.Web3Provider(window.ethereum); const accounts = await web3Provider.listAccounts(); if (accounts.length > 0) { userAddress = accounts[0]; signer = web3Provider.getSigner(); document.getElementById("connect-btn").innerText = userAddress.slice(0,6) + "..." + userAddress.slice(-4); } } loadData(); setupCalculator(); }
        async function loadData() { try { const [tvl, len] = await Promise.all([iscContract.balanceOf(CONFIG.STAKING_ADDR), stakingContract.poolLength()]); document.getElementById("total-staked").innerText = parseFloat(ethers.utils.formatEther(tvl)).toLocaleString() + " ISC"; const poolPromises = []; for(let i=0; i<len.toNumber(); i++) poolPromises.push(stakingContract.poolInfo(i)); const poolResults = await Promise.all(poolPromises); pools = poolResults.map((p, i) => ({ id: i, lpToken: p.lpToken, lockPeriod: p.lockPeriod.toNumber(), apr: p.apr.toNumber() / 100, isLP: p.lpToken.toLowerCase() !== CONFIG.ISC_ADDR.toLowerCase() })); if(userAddress) { const [bal, userResults, rewardResults] = await Promise.all([ iscContract.balanceOf(userAddress), Promise.all(pools.map(p => stakingContract.userInfo(p.id, userAddress))), Promise.all(pools.map(p => stakingContract.pendingISC(p.id, userAddress))) ]); document.getElementById("user-balance").innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(2); let totalUserStaked = ethers.BigNumber.from(0), totalUserReward = ethers.BigNumber.from(0); pools.forEach((p, i) => { p.userStaked = userResults[i].amount; p.userReward = rewardResults[i]; totalUserStaked = totalUserStaked.add(p.userStaked); totalUserReward = totalUserReward.add(p.userReward); }); document.getElementById("user-staked").innerText = parseFloat(ethers.utils.formatEther(totalUserStaked)).toFixed(2); document.getElementById("user-reward").innerText = parseFloat(ethers.utils.formatEther(totalUserReward)).toFixed(4); } renderPools(); } catch(e) { console.error("Elite Data Load Error:", e); } }
        function renderPools() { const container = document.getElementById("pools-container"); const t = TRANSLATIONS[currentLang]; container.innerHTML = pools.map(p => `<div class="glass p-10 rounded-[2.5rem] card-hover flex flex-col relative overflow-hidden"><div class="absolute top-0 right-0 p-6"><span class="px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ${p.isLP ? 'badge-lp' : 'badge-single'}">${p.isLP ? t.lp_badge : t.single_badge}</span></div><div class="mb-10"><div class="text-slate-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2">${p.lockPeriod / 86400} ${t.days} ${p.isLP ? t.lp_desc : ''}</div><div class="text-5xl font-black text-white">${p.apr}% <span class="text-xs font-bold text-slate-500 uppercase tracking-widest">APR</span></div></div><div class="space-y-5 mb-10 flex-grow"><div class="flex justify-between items-center"><span class="text-slate-500 text-[10px] font-black uppercase tracking-widest">${t.stat_staked}</span><span class="font-black text-sm">${userAddress ? parseFloat(ethers.utils.formatEther(p.userStaked)).toFixed(2) : '0.00'} ISC</span></div><div class="flex justify-between items-center"><span class="text-slate-500 text-[10px] font-black uppercase tracking-widest">${t.stat_reward}</span><span class="font-black text-sm text-emerald-400">${userAddress ? parseFloat(ethers.utils.formatEther(p.userReward)).toFixed(4) : '0.0000'} ISC</span></div></div><div class="grid grid-cols-2 gap-4"><button onclick="openModal(${p.id}, true)" class="btn-primary py-4 rounded-2xl text-xs font-black shadow-xl shadow-cyan-500/20">${t.stake_btn}</button><button onclick="executeHarvest(${p.id})" class="glass py-4 rounded-2xl text-xs font-black hover:bg-white/10 transition-colors">${t.harvest_btn}</button><button onclick="openModal(${p.id}, false)" class="col-span-2 text-slate-600 hover:text-white text-[10px] font-black uppercase tracking-[0.2em] py-3 transition-colors">${t.unstake_btn}</button></div></div>`).join(''); }
        function setupCalculator() { const amt = document.getElementById('calc-amount'), pool = document.getElementById('calc-pool'), out = document.getElementById('calc-output'); const update = () => { const val = parseFloat(amt.value) || 0, apr = parseFloat(pool.value) / 100; const daysStr = pool.options[pool.selectedIndex].text, daysMatch = daysStr.match(/\d+/); const days = daysMatch ? parseInt(daysMatch[0]) : 7; out.innerText = ((val * apr * days) / 365).toFixed(2) + " ISC"; }; amt.oninput = update; pool.onchange = update; }
        function openModal(id, isStake) { if(!userAddress) return showToast(TRANSLATIONS[currentLang].conn_wallet); currentPoolId = id; isStakingMode = isStake; const p = pools[id], t = TRANSLATIONS[currentLang]; document.getElementById("modal").classList.remove("hidden"); document.getElementById("modal-title").innerText = isStake ? t.modal_stake : t.modal_unstake; document.getElementById("modal-pool-info").innerText = `${p.lockPeriod / 86400} ${t.days} ${p.isLP ? t.lp_desc : ''} (${p.apr}%)`; document.getElementById("modal-apr").innerText = p.apr + "%"; document.getElementById("modal-lock").innerText = (p.lockPeriod / 86400) + " " + t.days; document.getElementById("stake-input").value = ""; document.getElementById("confirm-btn").innerText = t.confirm_btn; document.getElementById("modal-token-symbol").innerText = p.isLP ? "LP" : "ISC"; setLang(currentLang); }
        function closeModal() { document.getElementById("modal").classList.add("hidden"); }
        async function setMax() { const p = pools[currentPoolId]; if(isStakingMode) { const tokenContract = new ethers.Contract(p.lpToken, ABI, provider); const bal = await tokenContract.balanceOf(userAddress); document.getElementById("stake-input").value = ethers.utils.formatEther(bal); } else { document.getElementById("stake-input").value = ethers.utils.formatEther(p.userStaked); } }
        async function executeTransaction() { const val = document.getElementById("stake-input").value; if(!val || isNaN(val)) return; const wei = ethers.utils.parseEther(val), btn = document.getElementById("confirm-btn"), t = TRANSLATIONS[currentLang], p = pools[currentPoolId]; try { btn.disabled = true; btn.innerText = t.pending; const signer = new ethers.providers.Web3Provider(window.ethereum).getSigner(); if(isStakingMode) { const tokenContract = new ethers.Contract(p.lpToken, ABI, provider); const allowance = await tokenContract.allowance(userAddress, CONFIG.STAKING_ADDR); if(allowance.lt(wei)) await (await tokenContract.connect(signer).approve(CONFIG.STAKING_ADDR, ethers.constants.MaxUint256)).wait(); await (await stakingContract.connect(signer).deposit(currentPoolId, wei)).wait(); } else { await (await stakingContract.connect(signer).withdraw(currentPoolId, wei)).wait(); } showToast(t.success); closeModal(); loadData(); } catch(e) { showToast(t.error + (e.data?.message || e.message)); } finally { btn.disabled = false; btn.innerText = t.confirm_btn; } }
        async function executeHarvest(id) { if(!userAddress) return showToast(TRANSLATIONS[currentLang].conn_wallet); try { const signer = new ethers.providers.Web3Provider(window.ethereum).getSigner(); await (await stakingContract.connect(signer).harvest(id)).wait(); showToast(TRANSLATIONS[currentLang].success); loadData(); } catch(e) { showToast(TRANSLATIONS[currentLang].error + (e.data?.message || e.message)); } }
        function showToast(msg) { const toast = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 4000); }
        document.getElementById("connect-btn").onclick = async () => { if (window.ethereum) { await window.ethereum.request({ method: "eth_requestAccounts" }); window.location.reload(); } else { alert("Please install MetaMask!"); } };
        window.onload = init;
    </script>
